<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Join the Tech Guild</h1>
            <p>Create your profile to start tracking your full-stack metrics.</p>
        </header>    
        <hr>
        <form>
            <section class="fullname">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="dev">
            </section>
            <section class="email">    
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="dev@gmail.com">
            </section>
            <section class="password">    
                <label for="password">Secure Password</label>
                <br>
                <input type="password" id="password" name="password">
                <br>
            </section>    
            <section class="experience">
                <label for="experience">Years of Experience</label>
                <input type="number" id="experience" name="experience" min="0" max="10" value="2">
            </section>    
            <section class="start">
                <label for="start">When do you want to start?</label>
                <!-- <br> -->
                <input type="date" id="start" name="start">
            </section>    
            <section class="gender">
                <h3>Gender</h3>
                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender">
                <label for="female">Female</label>
            </section>    
            
            <section class="radio">
                <h3>Primary Dev Track</h3>
                <div>
                    <input type="radio" id="dev" name="dev" value="Frontend">
                    <label for="dev">Frontend Domination</label>
                </div>   
                <div> 
                    <input type="radio" id="bg" name="dev" value="backend">
                    <label for="bg">Backend Engineering</label>
                </div>    
                <div>
                    <input type="radio" id="FS" name="dev" value="full-stack">
                    <label for="FS"> Full-Stack Unicorn</label>
                </div>    
            </section>    
            <section class="checkbox">
                <h3>Core Intrests</h3>
                <div>
                    <input type="checkbox" id="web" name="intrests" value="web" checked>
                    <label for="web">Web Applications</label>
                </div>  
                <div>  
                    <input type="checkbox" id="AI" name="intrests" value="ai">
                    <label for="AI">Autonomous AI & Agents</label>
                </div>    
                <div>
                    <input type="checkbox" id="analysis" name="intrests" value="soprts">
                    <label for="analysis">  Real-Time Sports Analytics</label>
                </div>    
            </section>
             <button type="submit">
                 Create Developer Profile
            </button>     
        </form>    

       
    </main> 

</body>
</html>
